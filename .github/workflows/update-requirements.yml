name: Update Requirements

on:
  # Run on push to main branch
  push:
    branches:
      - main
    paths:
      - '**/*.ipynb'
  
  # Run on pull requests that modify notebooks
  pull_request:
    paths:
      - '**/*.ipynb'
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run weekly on Mondays at 00:00 UTC
  schedule:
    - cron: '0 0 * * 1'

jobs:
  update-requirements:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Run requirements update script
        run: python3 .github/scripts/update_requirements.py
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet requirements.txt; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes to requirements.txt"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in requirements.txt"
          fi
      
      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update requirements.txt based on notebook imports'
          title: 'chore: auto-update requirements.txt'
          body: |
            This PR automatically updates `requirements.txt` based on the Python imports found in all Jupyter notebooks.
            
            **Generated by:** GitHub Actions workflow
            **Workflow:** Update Requirements
            **Triggered by:** ${{ github.event_name }}
          branch: auto-update-requirements
          delete-branch: true
          labels: dependencies, automated
